
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonClipping</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d17;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:650px;margin:auto}
h1{color:#a78bfa;font-size:27px}
p{color:#aaa}
.card{background:#171a2b;padding:20px;border:1px solid #30334a;border-radius:15px;margin:18px 0}
label{display:block;margin:15px 0 8px}
input{width:100%;padding:13px;border-radius:9px;background:#252940;color:white;border:1px solid #454968}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#8055ed;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.progress-bg{width:100%;height:15px;background:#30334a;border-radius:20px;overflow:hidden;margin-top:15px}
#progressBar{height:100%;width:0%;background:#a78bfa;transition:width .25s}
#percent{font-size:25px;color:#a78bfa;font-weight:bold;margin-top:12px}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>⚡ NEON CLIPPING</h1>
<p>Create your next viral Shorts!</p>

<div class="card">
<h2>🎬 Create Clips</h2>

<label>Upload your video</label>
<input id="video" type="file" accept="video/*">

<button id="make" onclick="createClips()">⚡ MAKE CLIPS</button>

<div id="progressArea" style="display:none">
<div class="progress-bg">
<div id="progressBar"></div>
</div>
<div id="percent">0%</div>
<p id="status">Waiting...</p>
</div>
</div>

<div class="card">
<h2>📁 My Clips</h2>
<p id="result">Your exported clips will appear here.</p>
</div>

</div>

<script>
const API = "https://neonclipping-backend.onrender.com";

const button = document.getElementById("make");
const videoInput = document.getElementById("video");
const progressArea = document.getElementById("progressArea");
const progressBar = document.getElementById("progressBar");
const percentText = document.getElementById("percent");
const statusText = document.getElementById("status");
const resultText = document.getElementById("result");

function showProgress(value, message) {
  const percent = Math.max(0, Math.min(100, Math.round(value)));
  progressBar.style.width = percent + "%";
  percentText.textContent = percent + "%";
  statusText.textContent = message;
}

function uploadVideo(file) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", API + "/process");

    xhr.upload.onprogress = (event) => {
      if (event.lengthComputable) {
        const value = (event.loaded / event.total) * 100;
        showProgress(value, "Uploading video...");
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          resolve(JSON.parse(xhr.responseText));
        } catch {
          reject(new Error("Invalid server response."));
        }
      } else {
        reject(new Error("Upload failed: " + xhr.responseText));
      }
    };

    xhr.onerror = () => reject(new Error("Network connection failed."));
    xhr.send(formData);
  });
}

async function checkProgress(jobId) {
  while (true) {
    const response = await fetch(API + "/progress/" + jobId);

    if (!response.ok) {
      throw new Error("Could not check processing progress.");
    }

    const data = await response.json();

    showProgress(data.progress, data.status);

    if (data.state === "completed") {
      return;
    }

    if (data.state === "failed") {
      throw new Error(data.error || "Video processing failed.");
    }

    await new Promise(resolve => setTimeout(resolve, 1500));
  }
}

async function downloadClips(jobId) {
  statusText.textContent = "Downloading your clips...";

  const response = await fetch(API + "/download/" + jobId);

  if (!response.ok) {
    throw new Error("Download failed.");
  }

  const blob = await response.blob();
  const downloadUrl = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = downloadUrl;
  link.download = "neonclipping_clips.zip";
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
}

async function createClips() {
  const file = videoInput.files[0];

  if (!file) {
    alert("Please select a video first.");
    return;
  }

  if (file.size > 100 * 1024 * 1024) {
    alert("Video must be under 100 MB.");
    return;
  }

  button.disabled = true;
  progressArea.style.display = "block";
  resultText.textContent = "Processing your video...";

  try {
    showProgress(0, "Starting upload...");

    const uploadResult = await uploadVideo(file);

    if (!uploadResult.job_id) {
      throw new Error("Server did not return a job ID.");
    }

    showProgress(0, "Upload complete. Processing started...");

    await checkProgress(uploadResult.job_id);

    await downloadClips(uploadResult.job_id);

    showProgress(100, "✅ Processing completed!");
    resultText.textContent = "Your ZIP download has started.";

  } catch (error) {
    statusText.textContent = "❌ " + error.message;
    resultText.textContent = "Please try again.";
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
