

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonClipping Web</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0d17;color:white;
 font-family:Arial,sans-serif;padding:20px
}
.container{max-width:650px;margin:auto}
h1{color:#a78bfa;font-size:27px}
p{color:#aaa}
.card{
 background:#171a2b;padding:20px;
 border:1px solid #30334a;
 border-radius:15px;margin:18px 0
}
label{display:block;margin:15px 0 8px}
input,select{
 width:100%;padding:13px;border-radius:9px;
 background:#252940;color:white;
 border:1px solid #454968
}
button{
 width:100%;padding:15px;margin-top:20px;
 border:0;border-radius:10px;
 background:#8055ed;color:white;
 font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
small{color:#aaa}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>⚡ NEON CLIPPING</h1>
<p>Create your next viral Shorts!</p>

<div class="card">
<h2>🎬 Create Clips</h2>

<label>YouTube / Twitch / Kick URL</label>
<input id="url" type="url"
placeholder="YouTube link processing coming soon">

<label>Or upload your video</label>
<input id="video" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">

<label>Clip duration</label>
<select id="duration">
<option>20-30 seconds</option>
<option>30-45 seconds</option>
<option>45-60 seconds</option>
</select>

<label>Video format</label>
<select id="format">
<option>9:16 Vertical Shorts</option>
<option>16:9 Landscape</option>
<option>1:1 Square</option>
</select>

<label>Captions</label>
<select id="captions">
<option>ON</option>
<option>OFF</option>
</select>

<button id="make" onclick="createClips()">
⚡ MAKE CLIPS
</button>

<p id="status">Checking backend connection...</p>
</div>

<div class="card">
<h2>📁 My Clips</h2>
<p id="result">Your exported clips will appear here.</p>
</div>

<small>NeonClipping Web Edition</small>
</div>

<script>
const API = "https://neonclipping-backend.onrender.com";

async function checkBackend(){
 const status = document.getElementById("status");
 try{
  const response = await fetch(API + "/", {
   method:"GET"
  });
  if(!response.ok) throw new Error("Backend unavailable");
  status.textContent = "✅ Backend connected!";
 }catch(error){
  status.textContent = "❌ Backend connection failed. Please try again.";
 }
}

async function createClips(){
 const url = document.getElementById("url").value.trim();
 const video = document.getElementById("video").files[0];
 const status = document.getElementById("status");
 const result = document.getElementById("result");
 const button = document.getElementById("make");

 if(!video){
  status.textContent = url
   ? "YouTube link processing is not available yet. Please upload a video."
   : "Please select a video first.";
  return;
 }

 if(video.size > 100 * 1024 * 1024){
  status.textContent = "Video must be under 100 MB.";
  return;
 }

 button.disabled = true;
 status.textContent = "⏳ Uploading and processing video...";
 result.textContent = "Please wait...";

 try{
  const formData = new FormData();
  formData.append("file", video);

  const response = await fetch(API + "/process", {
   method:"POST",
   body:formData
  });

  if(!response.ok){
   let message = "Video processing failed.";
   try{
    const error = await response.json();
    message = error.detail || message;
   }catch(e){}
   throw new Error(message);
  }

  const blob = await response.blob();
  const downloadUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = downloadUrl;
  link.download = "neonclipping_clips.zip";
  document.body.appendChild(link);
  link.click();
  link.remove();

  status.textContent = "✅ Video processing completed!";
  result.textContent = "Your ZIP download has started.";

  setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);

 }catch(error){
  status.textContent = "❌ " + error.message;
  result.textContent = "Please try again.";
 }finally{
  button.disabled = false;
 }
}

checkBackend();
</script>
</body>
</html>
